# www.mahahe.it and helm.mahahe.it. TLS ends at the Ingress: plain HTTP on 8080.

# Redirects nginx makes itself (/helm -> /helm/) keep the scheme and host the
# client used, instead of http://<host>:8080 as seen inside the pod.
absolute_redirect off;

# The legacy HTTPS chart repository (helm repo add https://helm.mahahe.it),
# frozen at 0.1.x: serve its index.yaml and packages, send everything else
# to the Helm page of the site.
server {
    listen 8080;
    server_name helm.mahahe.it;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /index.yaml {
        root /usr/share/nginx/html/legacy-helm;
        default_type application/x-yaml;
    }

    location ~ ^/[^/]+\.tgz$ {
        root /usr/share/nginx/html/legacy-helm;
        default_type application/gzip;
    }

    location / {
        return 301 https://www.mahahe.it/helm/;
    }
}

# Bare domain: always www
server {
    listen 8080;
    server_name mahahe.it;
    return 301 https://www.mahahe.it$request_uri;
}

# www.mahahe.it, and any other host (port-forward, health checks)
server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
